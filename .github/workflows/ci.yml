name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_INCREMENTAL: 0
  CARGO_TARGET_DIR: target
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  ci:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libudev-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libvulkan-dev \
            pkg-config

      - name: Format check
        if: runner.os == 'Linux'
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy -- -D warnings

      - name: Test simulation
        run: cargo test -p simulation

      - name: Test workspace
        run: cargo test --workspace
        env:
          WGPU_BACKEND: noop

      - name: Build
        run: cargo build --workspace

      - name: Benchmark compilation check
        run: cargo bench -p bench --no-run

      - name: Constitution — forbidden types in simulation
        if: runner.os == 'Linux'
        run: |
          echo "Checking simulation crate for forbidden bevy_* imports..."
          FORBIDDEN="bevy_render|bevy_window|bevy_ui|bevy_audio|bevy_input|bevy_asset|bevy_math"
          if grep -rn "use ${FORBIDDEN}" crates/simulation/src/ --include="*.rs" 2>/dev/null; then
            echo "::error::simulation crate contains forbidden bevy_* imports"
            exit 1
          fi
          echo "PASS: no forbidden imports"

      - name: Constitution — float infiltration in simulation
        if: runner.os == 'Linux'
        run: |
          echo "Checking simulation crate for non-whitelisted f32/f64 usage..."
          # 白名单机制（两重，缺一不可）：
          #   1) 宪法 §2.3 例外条款允许的浮点桥接**函数体**必须显式标注
          #      `CONSTITUTION-ALLOW`（见 types.rs 的 from_float/to_float）；
          #   2) 这些桥接函数自身的**签名行**按函数名豁免。
          # 其余豁免：tick_duration（ADR 声明的调度层）、gen_probability（返回 u32）、注释与文档。
          HITS=$(grep -rn '\bf32\b\|\bf64\b' crates/simulation/src/ --include="*.rs" \
            | grep -v "CONSTITUTION-ALLOW" \
            | grep -v "from_float\|to_float\|tick_duration\|gen_probability\|//.*f32\|//.*f64\|///\|deprecated\|doc" \
            || true)
          if [ -n "$HITS" ]; then
            echo "::error::Non-whitelisted f32/f64 found in simulation crate:"
            echo "$HITS"
            exit 1
          fi
          echo "PASS: no float infiltration"

      - name: Machine acceptance — headless scenario (determinism + replay round-trip)
        if: runner.os == 'Linux'
        run: |
          echo "Running agent-facing verification CLI (constitution §10.1/§10.2)..."
          cargo run -p sim-cli -- scenario --seed 42 --map small --ticks 500 \
            --repeat 2 --record /tmp/golden-scenario.ron --json

      - name: Constitution — dependency topology
        if: runner.os == 'Linux'
        run: |
          echo "Checking simulation crate dependencies..."
          DEPS=$(grep -E "^\[dependencies" -A50 crates/simulation/Cargo.toml | grep -v "^\[" | grep -v "^$" | grep -v "^#")
          FORBIDDEN_DEPS="bevy_adapter\|presentation\|render_view"
          if echo "$DEPS" | grep -q "$FORBIDDEN_DEPS"; then
            echo "::error::simulation crate depends on downstream crate"
            exit 1
          fi
          echo "PASS: dependency topology correct"

      - name: Constitution — hash_world_state coverage
        if: runner.os == 'Linux'
        run: python3 scripts/check-hash-coverage.py
