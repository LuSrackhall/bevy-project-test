[package]
name = "render_view"
version = "0.1.0"
edition = "2021"

[dependencies]
simulation = { path = "../simulation" }
bevy_adapter = { path = "../bevy_adapter" }
presentation = { path = "../presentation" }
bevy = { version = "0.19", features = ["bevy_ui_widgets", "bevy_input_focus", "debug"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"

[target.'cfg(target_arch = "wasm32")'.dependencies.web-sys]
version = "0.3"
features = [
    "Document", "Element", "HtmlCanvasElement", "HtmlElement",
    "HtmlInputElement", "KeyboardEvent", "EventTarget",
    "CssStyleDeclaration",
]
